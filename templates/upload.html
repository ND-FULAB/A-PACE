<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload</title>
    <style>
        body {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 20px;
            margin: 20px;
        }
        .sidebar {
            margin-right: 20px;
            display: flex;
            flex-direction: column;
        }
        .sidebar button {
            margin: 10px 0;
            padding: 10px;
            font-size: 16px;
            width: 150px;
        }
        .home-button {
            background-color: blue;
            color: white;
            cursor: pointer;
        }
        .upload-button {
            background-color: #4CAF50; /* Green */
            color: white;
            cursor: pointer;
        }
        .pass-button {
            background-color: #008CBA; /* Blue */
            color: white;
            cursor: pointer;
        }
        .fail-button {
            background-color: #f44336; /* Red */
            color: white;
            cursor: pointer;
        }
        .add-info-button {
            background-color: #e7e7e7; /* Gray */
            color: black;
            cursor: pointer;
        }
        .graph-button {
            background-color: #555555; /* Black */
            color: white;
            cursor: pointer;
        }
        .form-container {
            flex: 1 1 520px;
            min-width: 0;
        }
        .uploaded-files {
            margin-top: 20px;
        }
        .uploaded-files table {
            width: 100%;
            border-collapse: collapse;
        }
        .uploaded-files table, .uploaded-files th, .uploaded-files td {
            border: 1px solid black;
        }
        .uploaded-files th, .uploaded-files td {
            padding: 8px;
            text-align: left;
        }
        .delete-button {
            background-color: whitesmoke;
            color: red;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
        }
        .graphs-container {
            margin-top: 20px;
        }
        .graph {
            margin-bottom: 20px;
        }
        .delete-buttons {
            display: flex;
            align-items: center;
            gap: 10px; /* Add space between the buttons */
            margin-bottom: 10px; /* Add some margin below the buttons */
            border-radius: 10px;
        }
        .delete-multiple-button, .delete-all-button {
            width: 155px; /* Set a fixed width */
            height: 30px; /* Set a fixed height */
            background-color: #33af9e; /* Same background color */
            color: white; /* Same text color */
            border: none; /* Remove default borders */
            padding: 5px; /* Add padding for better spacing */
            text-align: center; /* Center text */
            text-decoration: none; /* Remove text underline */
            display: inline-block; /* Inline-block to apply width and height */
            font-size: 14px; /* Set font size */
            cursor: pointer; /* Pointer cursor on hover */
            border-radius: 10px;
        }

        .delete-all-button {
            background-color: rgb(99, 72, 197); /* Custom background color for this button */
            cursor: pointer;
        }
        .upload-button {
            background-color: rgb(76, 184, 68); /* Black */
            color: white;
            cursor: pointer;
        }
        .slidecontainer {
            width: 100%; /* Full-width */
            margin: 20px 0; /* Some margin */
        }
        .slider {
            -webkit-appearance: none; /* Override default CSS styles */
            appearance: none;
            width: 100%; /* Full-width */
            height: 15px; /* Specified height */
            background: #d3d3d3; /* Grey background */
            outline: none; /* Remove outline */
            opacity: 0.7; /* Set transparency (for mouse-over effects on hover) */
            -webkit-transition: .2s; /* 0.2 seconds transition on hover */
            transition: opacity .2s;
        }
        .slider:hover {
            opacity: 1; /* Fully shown on mouse-over */
        }
        .slider::-webkit-slider-thumb {
            -webkit-appearance: none; /* Override default look */
            appearance: none;
            width: 15px; /* Set a specific slider handle width */
            height: 15px; /* Slider handle height */
            background: #d01f51; /* Green background */
            cursor: pointer; /* Cursor on hover */
        }
        .slider-labels {
            display: flex;
            justify-content: space-between;
            margin-top: -10px;
        }
        .slider-value {
            text-align: center;
            margin-top: 10px;
        }
        .algorithm-container {
            background-color: #f0f0f0; /* Light grey background */
            box-sizing: border-box;
            flex: 0 1 360px;
            width: 360px;
            height: auto;
            padding: 28px;
            border: 2px solid #ccc; /* Border for better visual separation */
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); /* Light shadow for depth */
        }
        .algorithm-container h2 {
            margin: 0 0 24px;
            font-size: 28px;
            line-height: 1.2;
        }
        .parameter-field {
            margin-bottom: 20px;
        }
        .parameter-field label {
            display: block;
            margin-bottom: 8px;
            font-size: 18px;
            font-weight: 600;
        }
        .parameter-field input {
            box-sizing: border-box;
            width: 100%;
            min-height: 44px;
            padding: 8px 10px;
            border: 1px solid #888;
            border-radius: 6px;
            background-color: white;
            font-size: 18px;
        }
        .parameter-field input:focus-visible,
        .run-button:focus-visible {
            outline: 3px solid #015db6;
            outline-offset: 2px;
        }
        .run-button {
            width: 100%; /* Full width of the container */
            min-height: 48px;
            background-color: #d01f51; /* Green background */
            color: white; /* White text */
            border: none; /* Remove borders */
            margin-top: 4px; /* Margin for spacing */
            font-size: 20px; /* Font size */
            font-weight: 600;
            cursor: pointer; /* Pointer cursor on hover */
            border-radius: 10px;
        }
        .run-button:disabled {
            cursor: wait;
            opacity: 0.65;
        }
        .uploaded-files-button{
            background-color: #015db6; 
            color: white;
            width: 320px;
            height: 25px;
            font-size: 16px;
            border-radius: 20px;
            border: none; /* Remove borders */
            cursor: pointer;
        }
        .uploaded-files-button:disabled {
            cursor: wait;
            opacity: 0.65;
        }
        #fileUploadStatus {
            min-height: 1.25rem;
            margin: 8px 0 0;
            color: #4232a8;
        }
        #fileUploadStatus.error {
            color: #b00020;
        }
        .progress-container {
            margin-top: 20px; /* Add margin to separate it from the Run button */
            text-align: left;
            width: 100%; /* Ensure the container takes full width available */
        }

        #analysisProgressBar {
            width: 100%; /* Full width of the container */
            height: 24px; /* Increased height for better visibility */
        }
        #analysisProgressLabel {
            display: flex;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 8px;
            font-size: 17px;
            font-weight: 600;
        }
        #analysisProgressText {
            min-height: 1.3em;
            margin: 8px 0 0;
            line-height: 1.35;
        }
        #analysisError {
            margin: 12px 0 0;
            color: #b00020;
            font-weight: 600;
        }
        .exit-button {
            background-color: #e7ad30;
            color: white;
            cursor: pointer;
        }
        @media (max-width: 760px) {
            body {
                flex-direction: column;
                margin: 12px;
            }
            .sidebar {
                flex-direction: row;
                flex-wrap: wrap;
                margin-right: 0;
                gap: 8px;
            }
            .sidebar button {
                flex: 1 1 140px;
                width: auto;
                margin: 0;
            }
            .algorithm-container {
                flex: 1 1 auto;
                width: 100%;
                max-width: 520px;
                padding: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <button class="home-button" onclick="location.href='/post_exp'">Home</button>
        <button class="upload-button" onclick="location.href='/post_exp/upload'">Upload Files</button>
        <button class="pass-button" onclick="location.href='/post_exp/pass'">Pass</button>
        <button class="fail-button" onclick="location.href='/post_exp/fail'">Fail</button>
        <button class="add-info-button" onclick="location.href='/post_exp/data-table'">Data Table</button>
        <button class="graph-button" onclick="location.href='/post_exp/3d-graph'">Graph</button>
        <button class="exit-button" onclick="handleExit()">Download Results</button>
    </div>

    <div class="form-container">
        <h1>Upload Your Files</h1>
        <button id="fileUploadButton" class="uploaded-files-button" type="button" onclick="launchFileGUI()">Select Files</button>
        <p id="fileUploadStatus" role="status" aria-live="polite"></p>
        
        {% if files.csv or files.pssession %}
        <div class="uploaded-files">
            <h2>Uploaded Files</h2>
            <form action="/post_exp/delete-multiple" method="post">
                <div class="delete-buttons">
                    <input class="delete-multiple-button" type="submit" value="Delete Selected Files">
                    <input class="delete-all-button" formaction="/post_exp/delete-all" type="submit" value="Delete ALL Files">
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Select</th>
                            <th>File Name</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for file_type, file_list in files.items() %}
                            {% for file_name in file_list %}
                            <tr>
                                <td><input type="checkbox" name="delete_files" value="{{ file_name }}"></td>
                                <td>{{ file_name }}</td>
                            </tr>
                            {% endfor %}
                        {% endfor %}
                    </tbody>
                </table>
            </form>
        </div>
        {% endif %}
    </div>
    <aside class="algorithm-container" aria-labelledby="analysisParametersHeading">
        <form id="analysisForm">
            <h2 id="analysisParametersHeading">Enter The Parameters</h2>
            <div class="parameter-field">
                <label for="successWeight">Success Weight:</label>
                <input
                    type="number"
                    id="successWeight"
                    name="successWeight"
                    min="0"
                    max="1"
                    step="0.01"
                    value="0.5"
                    required
                >
            </div>
            <div class="parameter-field">
                <label for="noiseLevel">Noise Level (1-3):</label>
                <input
                    type="number"
                    id="noiseLevel"
                    name="noiseLevel"
                    min="1"
                    max="3"
                    step="1"
                    value="2"
                    required
                >
            </div>
            <div class="parameter-field">
                <label for="Threshold">Peak Width Threshold:</label>
                <input
                    type="number"
                    id="Threshold"
                    name="Threshold"
                    min="0.2"
                    max="0.85"
                    step="0.01"
                    value="0.65"
                    required
                >
            </div>
            <button id="runAnalysisButton" class="run-button" type="submit">Run Data Analysis</button>
            <div id="analysisProgressContainer" class="progress-container" hidden>
                <div id="analysisProgressLabel">
                    <span>Analysis progress</span>
                    <span id="analysisProgressPercent">0%</span>
                </div>
                <progress id="analysisProgressBar" value="0" max="100" aria-labelledby="analysisProgressLabel"></progress>
                <p id="analysisProgressText" role="status" aria-live="polite">Preparing analysis...</p>
            </div>
            <p id="analysisError" role="alert" hidden></p>
        </form>
    </aside>

    
    <script>
        function handleExit() {
            window.location.href = "/download-results";
        }
        const fileGUIStatusTemplate = "{{ url_for('file_gui_status', pid=0) }}";

        function setFileUploadStatus(message, isError = false) {
            const status = document.getElementById("fileUploadStatus");
            status.textContent = message;
            status.classList.toggle("error", isError);
        }

        function fileGUIStatusURL(pid) {
            return fileGUIStatusTemplate.replace(/0$/, String(pid));
        }

        function wait(milliseconds) {
            return new Promise(resolve => window.setTimeout(resolve, milliseconds));
        }

        async function waitForFileGUI(pid) {
            while (true) {
                await wait(750);
                const response = await fetch(fileGUIStatusURL(pid), { cache: "no-store" });
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || "Unable to check the file selector status.");
                }
                if (!data.running) {
                    return;
                }
            }
        }

        async function launchFileGUI() {
            const button = document.getElementById("fileUploadButton");
            button.disabled = true;
            setFileUploadStatus("Opening the file selector...");

            try {
                const response = await fetch("{{ url_for('launch_file_gui') }}", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                });
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.error || "Unable to open the file selector.");
                }

                setFileUploadStatus("Choose files, then click Save and Return.");
                await waitForFileGUI(data.pid);
                setFileUploadStatus("Refreshing the uploaded file list...");
                window.location.reload();
            } catch (error) {
                console.error("File upload error:", error);
                setFileUploadStatus(error.message, true);
                button.disabled = false;
            }
        }

        const analysisForm = document.getElementById("analysisForm");
        const runAnalysisButton = document.getElementById("runAnalysisButton");
        const analysisProgressContainer = document.getElementById("analysisProgressContainer");
        const analysisProgressBar = document.getElementById("analysisProgressBar");
        const analysisProgressPercent = document.getElementById("analysisProgressPercent");
        const analysisProgressText = document.getElementById("analysisProgressText");
        const analysisError = document.getElementById("analysisError");
        const analysisStatusURL = "/post_exp/upload/data/status";
        const analysisFallbackURL = "/post_exp/pass";
        const activeAnalysisStates = new Set(["pending", "starting", "validating", "running"]);
        const successfulAnalysisStates = new Set(["success", "succeeded", "complete", "completed"]);
        const failedAnalysisStates = new Set(["failed", "error"]);
        let analysisPollGeneration = 0;
        let analysisRedirecting = false;

        function normalizedAnalysisState(data) {
            if (data && typeof data.state === "string") {
                return data.state.toLowerCase();
            }
            return data && data.running === true ? "running" : "idle";
        }

        function isActiveAnalysisState(data) {
            return activeAnalysisStates.has(normalizedAnalysisState(data));
        }

        function setAnalysisBusy(isBusy) {
            runAnalysisButton.disabled = isBusy;
            analysisForm.setAttribute("aria-busy", String(isBusy));
            if (isBusy) {
                analysisProgressContainer.hidden = false;
                analysisError.hidden = true;
                analysisError.textContent = "";
            }
        }

        function updateAnalysisProgress(data = {}) {
            const parsedPercent = Number(data.percent);
            const percent = Number.isFinite(parsedPercent)
                ? Math.min(100, Math.max(0, parsedPercent))
                : Number(analysisProgressBar.value) || 0;
            const completedFiles = Number(data.completed_files);
            const totalFiles = Number(data.total_files);
            let message = typeof data.message === "string" && data.message.trim()
                ? data.message.trim()
                : "Analysis is running...";

            if (Number.isFinite(completedFiles) && Number.isFinite(totalFiles) && totalFiles > 0) {
                message += ` (${completedFiles}/${totalFiles} files)`;
            }

            analysisProgressContainer.hidden = false;
            analysisProgressBar.value = percent;
            analysisProgressPercent.textContent = `${Math.round(percent)}%`;
            analysisProgressText.textContent = message;
        }

        function showAnalysisFailure(message) {
            analysisPollGeneration += 1;
            setAnalysisBusy(false);
            analysisProgressText.textContent = "Analysis stopped.";
            analysisError.textContent = message || "Data analysis failed. Please try again.";
            analysisError.hidden = false;
        }

        function redirectAfterAnalysis(url = analysisFallbackURL) {
            if (analysisRedirecting) {
                return;
            }
            analysisRedirecting = true;
            analysisPollGeneration += 1;
            updateAnalysisProgress({ percent: 100, message: "Analysis complete. Opening the Pass page..." });
            window.setTimeout(() => {
                window.location.href = url || analysisFallbackURL;
            }, 250);
        }

        async function readResponseBody(response) {
            const text = await response.text();
            if (!text) {
                return {};
            }
            try {
                return JSON.parse(text);
            } catch (error) {
                return { message: text };
            }
        }

        function responseErrorMessage(response, data) {
            if (data && typeof data.error === "string" && data.error.trim()) {
                return data.error.trim();
            }
            if (data && typeof data.message === "string" && data.message.trim()) {
                return data.message.trim();
            }
            return `Data analysis failed (${response.status} ${response.statusText || "request error"}).`;
        }

        async function pollAnalysisStatus({ hasSeenActive = false } = {}) {
            const generation = ++analysisPollGeneration;

            while (generation === analysisPollGeneration && !analysisRedirecting) {
                try {
                    const response = await fetch(analysisStatusURL, { cache: "no-store" });
                    const data = await readResponseBody(response);
                    if (!response.ok) {
                        throw new Error(responseErrorMessage(response, data));
                    }

                    const state = normalizedAnalysisState(data);
                    if (activeAnalysisStates.has(state)) {
                        hasSeenActive = true;
                        setAnalysisBusy(true);
                        updateAnalysisProgress(data);
                    } else if (successfulAnalysisStates.has(state)) {
                        if (hasSeenActive) {
                            redirectAfterAnalysis(data.redirect_url || analysisFallbackURL);
                            return;
                        }
                    } else if (failedAnalysisStates.has(state) && hasSeenActive) {
                        showAnalysisFailure(data.error || data.message || "Data analysis failed. Please try again.");
                        return;
                    }
                } catch (error) {
                    console.warn("Unable to refresh analysis progress:", error);
                    if (hasSeenActive) {
                        analysisProgressText.textContent = "Analysis is still running; waiting for a progress update...";
                    }
                }

                await wait(500);
            }
        }

        async function launchDataAnalysis(event) {
            event.preventDefault();
            if (!analysisForm.reportValidity() || runAnalysisButton.disabled) {
                return;
            }

            const payload = {
                successWeight: Number(document.getElementById("successWeight").value),
                noiseLevel: Number(document.getElementById("noiseLevel").value),
                Threshold: Number(document.getElementById("Threshold").value),
            };

            analysisPollGeneration += 1;
            setAnalysisBusy(true);
            updateAnalysisProgress({ percent: 0, message: "Starting data analysis..." });

            try {
                const analysisRequest = fetch("{{ url_for('analyze') }}", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload),
                });
                void pollAnalysisStatus().catch(error => {
                    console.warn("Analysis status polling stopped:", error);
                });

                const response = await analysisRequest;
                const data = await readResponseBody(response);
                if (!response.ok) {
                    throw new Error(responseErrorMessage(response, data));
                }

                redirectAfterAnalysis(data.redirect_url || analysisFallbackURL);
            } catch (error) {
                console.error("Data analysis error:", error);
                showAnalysisFailure(error.message);
            }
        }

        async function resumeAnalysisIfRunning() {
            try {
                const response = await fetch(analysisStatusURL, { cache: "no-store" });
                const data = await readResponseBody(response);
                if (response.ok && isActiveAnalysisState(data)) {
                    setAnalysisBusy(true);
                    updateAnalysisProgress(data);
                    void pollAnalysisStatus({ hasSeenActive: true });
                }
            } catch (error) {
                console.warn("Unable to check for a running analysis:", error);
            }
        }

        analysisForm.addEventListener("submit", launchDataAnalysis);
        void resumeAnalysisIfRunning();

    </script>
</body>
</html>
