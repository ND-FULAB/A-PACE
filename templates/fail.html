<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fail Graphs</title>
    <style>
        body {
            display: flex;
            flex-direction: row;
        }
        .sidebar {
            margin-right: 20px;
            display: flex;
            flex-direction: column;
        }
        .sidebar button {
            margin: 10px 0;
            padding: 10px;
            font-size: 16px;
            width: 150px;
        }
        .home-button {
            background-color: blue;
            color: white;
            cursor: pointer;
        }
        .upload-button {
            background-color: #4CAF50; /* Green */
            color: white;
            cursor: pointer;
        }
        .pass-button {
            background-color: #008CBA; /* Blue */
            color: white;
            cursor: pointer;
        }
        .fail-button {
            background-color: #f44336; /* Red */
            color: white;
            cursor: pointer;
        }
        .add-info-button {
            background-color: #e7e7e7; /* Gray */
            color: black;
            cursor: pointer;
        }
        .graph-button {
            background-color: #555555; /* Black */
            color: white;
            cursor: pointer;
        }
        .form-container {
            flex-grow: 1;
        }
        .restore-button {
            background-color: #008CBA;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 10px; 
        }
        .update-button {
            background-color: rgb(0, 128, 32);
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 10px; 
        }
        .graphs-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 10px;
        }
        .graph {
            border: 1px solid #ccc;
            padding: 5px;
        }
        .exit-button {
            background-color: #e7ad30;
            color: white;
            cursor: pointer;
        }
        {% include '_pagination_styles.html' %}
        .range-feedback { margin: 12px 0; color: #166534; }
        .range-feedback.error, .range-error { color: #b91c1c; }
        .range-editor {
            width: min(800px, calc(100vw - 48px));
            max-height: 80vh;
            box-sizing: border-box;
            overflow-y: auto;
            padding: 24px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.25);
        }
        .range-editor::backdrop { background: rgba(0, 0, 0, 0.35); }
        .range-editor h2 { margin-top: 0; }
        .range-editor p { line-height: 1.5; }
        .range-editor fieldset { margin: 16px 0; border: 1px solid #cbd5e1; }
        .range-editor legend { font-weight: bold; overflow-wrap: anywhere; }
        .range-editor table { width: 100%; border-collapse: collapse; }
        .range-editor th, .range-editor td { padding: 8px; text-align: left; }
        .range-editor input { width: 100%; min-width: 80px; padding: 8px; box-sizing: border-box; }
        .range-single-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .range-single-fields label { display: block; margin-bottom: 8px; }
        .range-editor-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
        .range-editor-actions button { padding: 9px 16px; border-radius: 5px; cursor: pointer; }
        .range-submit { color: white; background: #007bff; border: 1px solid #007bff; }
        .range-editor button:disabled { cursor: wait; opacity: 0.65; }
    </style>
    <script>window.__apaceAmdDefine = window.define; window.define = undefined;</script>
    <script>{{ plotly_js|safe }}</script>
    <script>window.define = window.__apaceAmdDefine; delete window.__apaceAmdDefine;</script>
</head>
<body>
    <div class="sidebar">
        <button class="home-button" onclick="location.href='/post_exp'">Home</button>
        <button class="upload-button" onclick="location.href='/post_exp/upload'">Upload Files</button>
        <button class="pass-button" onclick="location.href='/post_exp/pass'">Pass</button>
        <button class="fail-button" onclick="location.href='/post_exp/fail'">Fail</button>
        <button class="add-info-button" onclick="location.href='/post_exp/data-table'">Data Table</button>
        <button class="graph-button" onclick="location.href='/post_exp/3d-graph'">Graph</button>
        <button class="exit-button" onclick="handleExit()">Download Results</button>
    </div>
    <div class="form-container">
        <h1>Fail Graphs</h1>
        <button class="restore-button" onclick="restoreSelectedGraphs()">Recycle >> Back to [Pass]</button>
        <button id="updateRangesButton" class="update-button" onclick="updateSelectedGraphs()">Update Graphs Range</button>
        <p id="rangeFeedback" class="range-feedback" role="status" hidden></p>
        <!-- <h3>Data Filters</h3>
        <div class="filters">
            <label><input type="checkbox" id="peak_height" checked> Peak height</label>
            <label><input type="checkbox" id="frequency"> Frequency</label>
            <label><input type="checkbox" id="concentration"> Concentration</label>
        </div> -->
        <label><b>Graphs Range: [{{ current_start }}-{{ current_end }}]</b></label>
        <label><b>Graphs Total: {{ total_graphs }}</b></label>
        <div class="graphs-container">
            {% for graph in graphs %}
                <div class="graph">
                    <input type="checkbox" class="graph-checkbox"
                           data-file-name="{{ graph.file_name|e }}"
                           data-curve-no="{{ graph.curve_no|e }}">
                    {{ graph.html|safe }}
                </div>
            {% endfor %}
        </div>
        {% if total_graphs %}
        <div class="pagination-info">
            {% if page > 1 %}
                <a href="{{ url_for('fail_graphs', page=page-1) }}"><button>Previous</button></a>
            {% endif %}
            <span class="current-page">Page {{ page }} of {{ total_pages }}</span>
            {% if page < total_pages %}
                <a href="{{ url_for('fail_graphs', page=page+1) }}"><button>Next</button></a>
            {% endif %}
        </div>
        {% endif %}
    </div>
    <dialog id="rangeEditor" class="range-editor" aria-labelledby="rangeEditorTitle">
        <form id="rangeEditorForm">
            <h2 id="rangeEditorTitle">Update Graphs Range</h2>
            <p id="rangeEditorHelp"></p>
            <div id="rangeEditorFields"></div>
            <p id="rangeEditorError" class="range-error" role="alert" hidden></p>
            <div class="range-editor-actions">
                <button id="cancelRangeEdit" type="button">Cancel</button>
                <button id="submitRangeEdit" class="range-submit" type="submit">Recalculate</button>
            </div>
        </form>
    </dialog>
    <script>
        function handleExit() {
            window.location.href = "/download-results";
        }
        function selectedGraphReferences() {
            return Array.from(document.querySelectorAll('.graph-checkbox:checked')).map(checkbox => ({
                file_name: checkbox.dataset.fileName,
                curve_no: checkbox.dataset.curveNo
            }));
        }
        function restoreSelectedGraphs() {
            const selectedGraphs = selectedGraphReferences();
            fetch('/post_exp/restore_graphs', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ graphs: selectedGraphs }),
            }).then(response => {
                if (response.ok) {
                    location.reload();
                }
            });
        }
        
        const rangeEditor = document.getElementById('rangeEditor');
        const rangeForm = document.getElementById('rangeEditorForm');
        const rangeFields = document.getElementById('rangeEditorFields');
        const rangeError = document.getElementById('rangeEditorError');
        const rangeFeedback = document.getElementById('rangeFeedback');
        const updateRangesButton = document.getElementById('updateRangesButton');
        const rangeSubmitButton = document.getElementById('submitRangeEdit');
        const rangeCancelButton = document.getElementById('cancelRangeEdit');
        let rangeRows = [];
        let rangeSelection = [];
        let commonRange = false;
        let rangeBusy = false;

        function reportRangeMessage(message, error = false) {
            rangeFeedback.textContent = message;
            rangeFeedback.classList.toggle('error', error);
            rangeFeedback.hidden = false;
        }

        function rangeInput(peak, side, label) {
            const input = document.createElement('input');
            input.type = 'number';
            input.step = 'any';
            input.required = true;
            input.min = String(peak.potential_min);
            input.max = String(peak.potential_max);
            input.value = peak[side + '_val'] ?? '';
            input.setAttribute('aria-label', label);
            return input;
        }

        function addRangeRow(peak, container, groupIndex, label) {
            const leftInput = rangeInput(peak, 'left', `${label} left (V)`);
            const rightInput = rangeInput(peak, 'right', `${label} right (V)`);
            for (const input of [leftInput, rightInput]) {
                const cell = document.createElement('td');
                cell.appendChild(input);
                container.appendChild(cell);
            }
            rangeRows.push({peak, leftInput, rightInput, groupIndex});
        }

        function showRangeEditor(groups) {
            rangeFields.replaceChildren();
            rangeRows = [];
            rangeError.hidden = true;
            const allPeaks = groups.flatMap(group => group.peaks);
            const commonMinimum = Math.max(...allPeaks.map(peak => peak.potential_min));
            const commonMaximum = Math.min(...allPeaks.map(peak => peak.potential_max));
            commonRange = groups.every(group => !group.is_multi_peak) && commonMinimum < commonMaximum;
            document.getElementById('rangeEditorHelp').textContent = commonRange
                ? `Set the left and right boundaries for ${rangeSelection.length} selected signal(s).`
                : 'Set a separate range for each peak, ordered from low to high potential. All peaks of the same signal, including peaks on other pages or in Pass, are recalculated together.';

            if (commonRange) {
                const peak = {...allPeaks[0], potential_min: commonMinimum, potential_max: commonMaximum};
                for (const side of ['left', 'right']) {
                    if (!allPeaks.every(item => item[side + '_val'] === peak[side + '_val'])) {
                        peak[side + '_val'] = null;
                    }
                }
                const grid = document.createElement('div');
                grid.className = 'range-single-fields';
                const inputs = {};
                for (const side of ['left', 'right']) {
                    const wrapper = document.createElement('div');
                    const label = document.createElement('label');
                    label.textContent = `${side === 'left' ? 'Left' : 'Right'} value (V)`;
                    const input = rangeInput(peak, side, label.textContent);
                    input.id = `range_${side}_val`;
                    label.htmlFor = input.id;
                    wrapper.append(label, input);
                    grid.appendChild(wrapper);
                    inputs[side] = input;
                }
                rangeFields.appendChild(grid);
                rangeRows.push({peak, leftInput: inputs.left, rightInput: inputs.right, groupIndex: 0});
            } else {
                groups.forEach((group, groupIndex) => {
                    const fieldset = document.createElement('fieldset');
                    const legend = document.createElement('legend');
                    const fileLabel = group.source_file.split(/[\\/]/).pop();
                    legend.textContent = `${fileLabel} · ${group.curve_no}`;
                    legend.title = group.source_file;
                    const table = document.createElement('table');
                    const header = document.createElement('tr');
                    for (const label of ['Peak', 'Status', 'Left (V)', 'Right (V)']) {
                        const heading = document.createElement('th');
                        heading.textContent = label;
                        header.appendChild(heading);
                    }
                    table.appendChild(header);
                    group.peaks.forEach(peak => {
                        const row = document.createElement('tr');
                        const label = document.createElement('td');
                        label.textContent = group.is_multi_peak ? `Peak ${peak.peak_number}` : 'Signal';
                        const status = document.createElement('td');
                        status.textContent = peak.status === 'pass' ? 'Pass' : 'Fail';
                        row.append(label, status);
                        addRangeRow(peak, row, groupIndex, `${fileLabel} ${group.curve_no} ${label.textContent}`);
                        table.appendChild(row);
                    });
                    fieldset.append(legend, table);
                    rangeFields.appendChild(fieldset);
                });
            }
            rangeEditor.showModal();
        }

        async function updateSelectedGraphs() {
            if (rangeBusy || rangeEditor.open) return;
            const selected = selectedGraphReferences();
            if (!selected.length) {
                reportRangeMessage('Select at least one graph to update.', true);
                return;
            }
            updateRangesButton.disabled = true;
            try {
                const response = await fetch('/post_exp/graph_ranges', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({graphs: selected}),
                });
                const payload = await response.json();
                if (!response.ok) throw new Error(payload.error || 'Could not load peak ranges.');
                rangeSelection = selected;
                rangeFeedback.hidden = true;
                showRangeEditor(payload.groups);
            } catch (error) {
                reportRangeMessage(error.message, true);
            } finally {
                updateRangesButton.disabled = false;
            }
        }

        rangeForm.addEventListener('submit', async event => {
            event.preventDefault();
            if (rangeBusy || !rangeForm.reportValidity()) return;
            rangeError.hidden = true;
            const ranges = rangeRows.map(row => ({
                file_name: row.peak.file_name, curve_no: row.peak.curve_no,
                left_val: Number(row.leftInput.value), right_val: Number(row.rightInput.value),
            }));
            if (ranges.some(range => !Number.isFinite(range.left_val) || !Number.isFinite(range.right_val) || range.left_val >= range.right_val)) {
                rangeError.textContent = 'Each left boundary must be less than its right boundary.';
                rangeError.hidden = false;
                return;
            }
            for (let index = 1; index < ranges.length; index++) {
                if (rangeRows[index - 1].groupIndex === rangeRows[index].groupIndex && ranges[index - 1].right_val > ranges[index].left_val) {
                    rangeError.textContent = 'Peak ranges within one signal must be ordered and must not overlap.';
                    rangeError.hidden = false;
                    return;
                }
            }
            const requestBody = commonRange
                ? {graphs: rangeSelection, left_val: ranges[0].left_val, right_val: ranges[0].right_val}
                : {ranges};
            rangeBusy = true;
            rangeSubmitButton.disabled = rangeCancelButton.disabled = updateRangesButton.disabled = true;
            rangeSubmitButton.textContent = 'Recalculating…';
            try {
                const response = await fetch('/post_exp/update_graphs', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(requestBody),
                });
                const payload = await response.json();
                if (!response.ok) throw new Error(payload.error || 'Update failed.');
                rangeEditor.close();
                reportRangeMessage(`Updated ${payload.updated} peak result(s): ${payload.passed} Pass, ${payload.failed} Fail.`);
                setTimeout(() => location.reload(), 900);
            } catch (error) {
                rangeError.textContent = error.message;
                rangeError.hidden = false;
            } finally {
                rangeBusy = false;
                rangeSubmitButton.disabled = rangeCancelButton.disabled = updateRangesButton.disabled = false;
                rangeSubmitButton.textContent = 'Recalculate';
            }
        });
        rangeCancelButton.addEventListener('click', () => rangeEditor.close());
        rangeEditor.addEventListener('cancel', event => {
            if (rangeBusy) event.preventDefault();
        });
    </script>
</body>
</html>
