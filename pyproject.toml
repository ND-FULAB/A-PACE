[project]
name = "a-pace"
version = "0.1.0"
description = "Local electrochemical data analysis application"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "filelock==3.32.4",
    "flask==3.1.0",
    "matplotlib==3.10.1",
    "natsort==8.4.0",
    "numpy==2.2.3",
    "pandas==2.2.3",
    "plotly==6.0.0",
    "pybaselines==1.2.1",
    "python-dateutil==2.9.0.post0",
    "pythonnet==3.0.5",
    "ruptures==1.1.9",
    "scikit-learn==1.6.1",
    "scipy==1.15.2",
    "statsmodels==0.14.4",
    "tqdm==4.67.1",
    "watchdog==6.0.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.5",
]

[tool.uv]
package = false
